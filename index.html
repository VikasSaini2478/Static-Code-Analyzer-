<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C Mini Compiler — Static Syntax Analyzer</title>
  <link rel="stylesheet" href="main.css" />
</head>
<body>

<div id="app">

  <!-- ── Header ── -->
  <header id="header">
    <h1>
      <span class="logo-badge">MC</span>
      C Mini Compiler
    </h1>
    <div class="header-sep"></div>
    <div id="sample-bar">
      <span class="sample-label">Samples:</span>
      <!-- injected by ui.js -->
    </div>
    <div class="header-right">
      <button id="run-btn" title="Ctrl+Enter">▶ Run</button>
    </div>
  </header>

  <!-- ── Main panes ── -->
  <main id="main">

    <!-- LEFT: Source editor -->
    <div class="panel">
      <div class="panel-header">
        Source
        <span class="sub" id="char-count">0 chars</span>
      </div>
      <div id="editor-wrap">
        <div id="line-numbers"></div>
        <textarea
          id="source-editor"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          placeholder="// Write or paste C source code here…"
        ></textarea>
      </div>
    </div><!-- /left panel -->

    <!-- RIGHT: Output -->
    <div class="panel">
      <div class="panel-header">Output</div>

      <div class="phase-tabs">
        <div class="phase-tab active">
          Tokens
          <span class="tab-count">—</span>
        </div>
        <div class="phase-tab">
          AST
          <span class="tab-count">—</span>
        </div>
        <div class="phase-tab">
          Errors
          <span class="tab-count">0</span>
        </div>
        <div class="phase-tab">
          Warnings
          <span class="tab-count">0</span>
        </div>
        <div class="phase-tab">
          Symbols
          <span class="tab-count">—</span>
        </div>
        <div class="phase-tab">
          Stats
          <span class="tab-count">—</span>
        </div>
      </div>

      <!-- Tab 0: Tokens -->
      <div class="tab-pane active">
        <div class="output-scroll">
          <div id="token-stats"></div>
          <div id="token-stream"></div>
        </div>
      </div>

      <!-- Tab 1: AST -->
      <div class="tab-pane">
        <div class="output-scroll">
          <div id="ast-tree"></div>
        </div>
      </div>

      <!-- Tab 2: Errors -->
      <div class="tab-pane">
        <div class="output-scroll">
          <div id="error-summary"></div>
          <div id="error-list"></div>
        </div>
      </div>

      <!-- Tab 3: Warnings -->
      <div class="tab-pane">
        <div class="output-scroll">
          <div id="warning-list"></div>
        </div>
      </div>

      <!-- Tab 4: Symbol Table -->
      <div class="tab-pane">
        <div class="output-scroll">
          <div id="symbol-table"></div>
        </div>
      </div>

      <!-- Tab 5: Stats -->
      <div class="tab-pane">
        <div class="output-scroll">
          <div class="stats-section-title">Summary</div>
          <div class="stats-grid" id="stats-grid"></div>
          <div class="stats-section-title" style="margin-top:16px">Token breakdown</div>
          <div class="tok-breakdown" id="tok-breakdown"></div>
        </div>
      </div>

    </div><!-- /right panel -->
  </main>

  <!-- ── Status bar ── -->
  <div id="status-bar">
    <div class="status-item">
      <div class="status-dot"></div>
      <span>Ready</span>
    </div>
  </div>

</div>

<script type="module" src="main.js"></script>
</body>
</html>
